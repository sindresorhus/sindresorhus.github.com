name: Swift Site

on:
  push:
    branches:
      - swift-site
  pull_request:
    paths:
      - 'Package.swift'
      - 'Sources/**'
      - 'Tests/**'
      - 'source/**'
      - 'public/**'
      - '.github/workflows/swift-site.yml'

concurrency:
  group: swift-site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Swift version
        run: swift --version
      - name: Check browser script syntax
        run: |
          for file in public/scripts/*.js; do
            node --check "$file"
          done
      - name: Install image dependencies
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin fonts-inter python3-pil
      - name: Build Astro reference
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm ci
          npx astro build
          mv dist dist-astro
      - name: Test
        run: swift test
      - name: Build site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: swift run website validate
      - name: Compare route parity
        run: python3 scripts/compare-site-output.py dist-astro dist
      - name: Upload Astro reference
        uses: actions/upload-artifact@v6
        with:
          name: astro-reference
          path: dist-astro
          retention-days: 3
      - name: Upload Swift output
        uses: actions/upload-artifact@v6
        with:
          name: swift-output
          path: dist
          retention-days: 3
      - name: Compare RSS and sitemap parity
        run: python3 scripts/compare-site-xml.py dist-astro dist
      - name: Compare semantic HTML parity
        run: python3 scripts/compare-site-semantics.py dist-astro dist
      - name: Compare visible text parity
        run: python3 scripts/compare-site-text.py dist-astro dist
      - name: Compare OG visual parity
        run: python3 scripts/compare-og-images.py dist-astro dist
