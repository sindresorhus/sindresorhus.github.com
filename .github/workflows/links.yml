name: External links

on:
  schedule:
    - cron: '0 6 * * 1' # Every Monday
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Select Xcode
        run: sudo xcode-select --switch "$(ls -d /Applications/Xcode_27*.app | sort -V | tail -n 1)"
      - name: Build site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: swift run website build
      - uses: actions/upload-artifact@v5
        with:
          name: site
          path: dist

  check:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: site
          path: dist
      # Internal links are checked by every build. This checks the links to other sites, which break over time.
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --max-concurrency 8 --exclude '^https://sindresorhus\.com' 'dist/**/*.html'
          fail: true
