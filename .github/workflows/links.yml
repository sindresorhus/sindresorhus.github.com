name: External links

on:
  schedule:
    - cron: '23 6 * * 1' # Every Monday, not on the full hour, when GitHub delays and drops more scheduled runs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # Xcode 27 is the default Xcode on this image.
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          # The full history, for the dates of the sources.
          fetch-depth: 0
      # Like CI, for the key of the build cache.
      - name: Runner image version
        id: image
        run: echo "version=${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"
      # The build of the CI workflow, so only what changed since compiles.
      - uses: actions/cache/restore@v6
        with:
          path: |
            .build
            .cache/jpeg-xl
            ~/Library/Caches/org.swift.swiftpm/manifests
          key: build-${{ runner.os }}-${{ hashFiles('Package.resolved') }}-${{ steps.image.outputs.version }}-${{ github.sha }}
          # The build of the same image first, and after a new image, the newest build, which still has the package checkouts.
          restore-keys: |
            build-${{ runner.os }}-${{ hashFiles('Package.resolved') }}-${{ steps.image.outputs.version }}-
            build-${{ runner.os }}-${{ hashFiles('Package.resolved') }}-
      # The newest responses of the CI workflow, so the build does not ask the App Store again for all of them.
      - uses: actions/cache/restore@v6
        with:
          path: .cache/responses
          key: responses-${{ github.run_id }}
          restore-keys: responses-
      # Like CI, as the build makes the JPEG XL copies of the images.
      - name: Install JPEG XL
        run: brew install jpeg-xl
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
      # Like CI, so the sources that did not change since its build do not compile again.
      - name: Date the sources by their last commit
        run: git -c core.quotePath=false log --format=date:%ct --name-only --diff-merges=first-parent -- Package.swift Package.resolved Sources Tests | perl -nle 'if (/^date:(\d+)$/) { $date = $1 } elsif ($_ ne "" && !$seen{$_}++ && -e) { utime $date, $date, $_ }'
      # The same build command as CI, as other flags would compile everything again.
      - name: Build site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          swift build --build-tests --disable-index-store -Xswiftc -Xfrontend -Xswiftc -warn-long-expression-type-checking=200
          .build/debug/website build
      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: dist
          # Only the check job uses it.
          retention-days: 1

  check:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: site
          path: dist
      # Internal links are checked by every build. This checks the links to other sites, which break over time. The root directory resolves links like `/apps` to files, which are then left out. Many sites, like X, Instagram, Unsplash, Reddit, and Stack Exchange, block bots with 401, 403, or 429, so these count as OK. A page that is gone is still a 404.
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --max-concurrency 8 --accept '200..=299,401,403,429' --root-dir '${{ github.workspace }}/dist' --exclude '^file://' --exclude '^https://sindresorhus\.com' 'dist/**/*.html'
